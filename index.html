<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Worlds</title>
<style>:root{--bg:#F4F1EA;--ink:#1a1715;--dim:#6b645c;--card:#fff}@media (prefers-color-scheme:dark){:root{--bg:#141210;--ink:#f4f1ea;--dim:#a39b91;--card:#1f1c19}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"Helvetica Neue",Arial,sans-serif}main{max-width:1100px;margin:0 auto;padding:48px 16px}
h1{font-size:44px;margin:0 0 8px}p{color:var(--dim);max-width:640px}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-top:32px}
a.c{display:block;background:var(--card);border-radius:20px;overflow:hidden;color:inherit;text-decoration:none;box-shadow:0 8px 30px rgba(0,0,0,.08)}a.c img{width:100%;display:block}a.c div{padding:14px 18px}b{display:block;font-size:18px}small{color:var(--dim)}</style></head>
<body><main><h1>Worlds</h1><p>Living 3D worlds that play like strategy games. Claude built each one from a single prompt, as one HTML file. Click one to open it.</p>
<div class="g"><a class="c" href="gateflow/"><img src="media/gateflow.jpg" alt=""><div><b>Gateflow</b><small>Airport apron control</small></div></a>
<a class="c" href="siren/"><img src="media/siren.jpg" alt=""><div><b>Siren</b><small>Emergency response city</small></div></a>
<a class="c" href="talad/"><img src="media/talad.jpg" alt=""><div><b>Talad</b><small>Bangkok night market</small></div></a></div>
<p style="margin-top:32px"><a href="https://github.com/Felixo-gif/worlds" style="color:inherit">Prompts and code on GitHub</a></p></main></body></html>
