<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Talad · Night Market Ops</title>
<!-- three.js r185, loaded from the local file next to this page so it works offline and over file://.
     To load it from a CDN instead, replace the script tag below with any three.js classic build (one that sets window.THREE). -->
<style>
:root{--accent:#FF3D7F;--text:#f6f2ff;--mute:rgba(232,226,255,.62);--line:rgba(255,255,255,.13)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#141a3a;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Thonburi,"Noto Sans Thai",Arial,sans-serif;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c.drag{cursor:grabbing}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 95% at 50% 48%,rgba(0,0,0,0) 55%,rgba(8,8,30,.38) 100%)}
.glass{background:linear-gradient(160deg,rgba(40,40,92,.56),rgba(16,18,46,.52));backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 40px rgba(6,6,28,.34),inset 0 1px 0 rgba(255,255,255,.12)}
button{font:inherit;color:inherit}
#top{position:fixed;left:16px;right:16px;top:14px;height:58px;display:flex;align-items:center;gap:11px;padding:0 11px 0 11px;z-index:6}
.logo{display:flex;align-items:center;gap:10px;padding-right:4px}
.mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(145deg,#ff77a6,#FF3D7F 55%,#d71e61);display:grid;place-items:center;box-shadow:0 6px 18px rgba(255,61,127,.45),inset 0 1px 0 rgba(255,255,255,.35)}
.logo b{font-size:18px;letter-spacing:-.02em;display:block;line-height:1.05}
.logo span{font-size:10.5px;color:var(--mute);letter-spacing:.01em;white-space:nowrap}
.search{display:flex;align-items:center;gap:8px;height:36px;width:190px;padding:0 11px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);color:var(--mute)}
.search input{background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:12.5px;width:100%}
.search input::placeholder{color:rgba(232,226,255,.5)}
#areas{display:flex;gap:2px;padding:3px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.07)}
#areas button{all:unset;cursor:pointer;font-size:12px;font-weight:600;padding:7px 10px;border-radius:9px;color:var(--mute);white-space:nowrap;transition:background .2s,color .2s}
#areas button.on{background:rgba(255,61,127,.24);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,61,127,.55)}
.spacer{flex:1}
.pill{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;height:36px;padding:0 11px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);font-size:12.5px;font-weight:650;white-space:nowrap}
.pill.act{background:rgba(255,61,127,.22);border-color:rgba(255,61,127,.55)}
.pill .tmp{color:var(--mute);font-weight:600}
.dd{position:relative}
.menu{position:absolute;top:46px;right:0;width:256px;padding:6px;display:none;z-index:9}
.menu.open{display:block}
.mi{all:unset;cursor:pointer;display:grid;grid-template-columns:34px 1fr;align-items:center;gap:10px;width:100%;box-sizing:border-box;padding:8px;border-radius:11px}
.mi .ic{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.07);display:grid;place-items:center}
.mi b{display:block;font-size:13px;font-weight:650}
.mi span{font-size:11px;color:var(--mute)}
.mi.hov,.mi:hover{background:rgba(255,255,255,.09)}
.mi.cur .ic{background:rgba(255,61,127,.25);box-shadow:inset 0 0 0 1px rgba(255,61,127,.6)}
.ai{all:unset;cursor:pointer;display:block;padding:9px 10px;border-radius:11px;font-size:12px;line-height:1.35;width:100%;box-sizing:border-box}
.ai:hover{background:rgba(255,255,255,.08)}
.ai em{font-style:normal;display:block;color:var(--mute);font-size:10.5px;margin-top:2px}
.ai i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:1px}
#clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:15.5px;line-height:1.08;text-align:right;min-width:72px}
#clock small{display:block;font-size:10px;color:var(--mute);font-weight:550}
.iconbtn{all:unset;cursor:pointer;position:relative;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08)}
.badge{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;border-radius:9px;background:var(--accent);font-size:10px;font-weight:800;display:grid;place-items:center;box-shadow:0 0 0 2px rgba(22,22,52,.9)}
.toggle{all:unset;cursor:pointer;position:relative;width:62px;height:32px;border-radius:16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);flex:none}
.toggle .ico{position:absolute;top:8px;opacity:.55}
.toggle .knob{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:13px;background:linear-gradient(145deg,#ffd98a,#ff9a4a);box-shadow:0 2px 8px rgba(0,0,0,.35);transition:transform .35s,background .35s}
.toggle.night .knob{transform:translateX(30px);background:linear-gradient(145deg,#e9e6ff,#a9a3ff)}
.av{width:34px;height:34px;border-radius:50%;background:linear-gradient(145deg,#7c6cff,#FF3D7F);display:grid;place-items:center;font-weight:750;font-size:12px;border:2px solid rgba(255,255,255,.28);flex:none}
#left{position:fixed;left:16px;top:86px;bottom:16px;width:272px;display:flex;flex-direction:column;gap:10px;pointer-events:none;z-index:4}
#left>*{pointer-events:auto}
.kpi{padding:12px 14px 10px;height:98px;position:relative;overflow:hidden;flex:none}
.kh{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--mute);font-weight:650}
.kh svg{flex:none}
.kv{font-size:26px;font-weight:750;letter-spacing:-.02em;margin-top:5px;font-variant-numeric:tabular-nums;line-height:1.1}
.kv small{font-size:14px;color:var(--mute);font-weight:650;margin-left:3px}
.chip{margin-left:auto;font-size:10.5px;padding:2px 7px;border-radius:8px;background:rgba(91,227,176,.16);color:#86f2c9;font-weight:750;font-variant-numeric:tabular-nums}
.chip.dn{background:rgba(255,193,90,.16);color:#ffd27e}
.spark{position:absolute;right:12px;top:36px;width:92px;height:30px}
.ks{font-size:10.5px;color:var(--mute);margin-top:3px;white-space:nowrap}
.kbar{position:absolute;left:14px;bottom:12px;width:120px;height:4px;border-radius:2px;background:rgba(255,255,255,.1)}
.kbar i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,#ff9fc0,var(--accent))}
.flex1{flex:1}
#tracker{padding:13px 14px 12px;flex:none}
.ph{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:750}
.ph em{font-style:normal;font-size:10.5px;color:var(--mute);font-weight:600}
.live{font-size:10px;color:#ff9fbf;display:flex;gap:6px;align-items:center;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.live i{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(255,61,127,.25)}
.steps{position:relative;margin-top:8px}
.steps:before{content:'';position:absolute;left:10px;top:13px;bottom:13px;width:2px;background:rgba(255,255,255,.12)}
.step{display:grid;grid-template-columns:22px 1fr 44px;align-items:center;gap:7px;height:27px;position:relative}
.step .dot{width:12px;height:12px;border-radius:50%;border:2px solid rgba(255,255,255,.35);margin-left:5px;background:#24264f}
.step.on .dot{border-color:var(--accent);background:var(--accent);box-shadow:0 0 10px rgba(255,61,127,.7)}
.step .nm{font-size:12px;font-weight:600}
.step .bar{height:4px;border-radius:2px;background:rgba(255,255,255,.08);margin-top:3px;overflow:hidden}
.step .bar i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,#ff9fc0,var(--accent))}
.step .ct{font-size:13px;font-weight:750;text-align:right;font-variant-numeric:tabular-nums}
.ph2{font-size:10.5px;color:var(--mute);font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin:10px 0 2px}
.order{display:grid;grid-template-columns:1fr auto;padding:6px 9px 7px;border-radius:10px;background:rgba(255,255,255,.055);margin-top:5px;font-size:11.5px}
.order b{font-weight:650}
.order span{color:var(--mute);font-size:10.5px}
.order .pr{font-weight:750;font-variant-numeric:tabular-nums;text-align:right}
.segs{display:flex;gap:3px;margin-top:5px;grid-column:1/3}
.segs i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.12)}
.segs i.f{background:var(--accent)}
#right{position:fixed;right:16px;top:86px;bottom:16px;width:312px;display:flex;flex-direction:column;gap:12px;pointer-events:none;z-index:4}
#right>*{pointer-events:auto}
#detail{padding:16px;flex:0 0 468px;overflow:hidden;position:relative}
.dh{display:flex;gap:12px;align-items:center}
.dicon{width:44px;height:44px;border-radius:13px;background:rgba(255,61,127,.18);display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,61,127,.45);flex:none}
.dt{font-size:17px;font-weight:750;letter-spacing:-.01em;white-space:nowrap}
.dt small{font-size:12px;color:var(--mute);font-weight:600;margin-left:5px}
.ds{font-size:11.5px;color:var(--mute);margin-top:2px;white-space:nowrap}
.dx{all:unset;cursor:pointer;margin-left:auto;align-self:flex-start;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:rgba(255,255,255,.07);color:var(--mute);font-size:15px}
.status{display:inline-flex;align-items:center;gap:7px;margin-top:12px;font-size:11.5px;font-weight:750;padding:5px 10px;border-radius:9px;background:rgba(255,61,127,.16);color:#ffb8cf}
.status i{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.cell{padding:8px 10px;border-radius:11px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.06)}
.cell b{display:block;font-size:17px;font-weight:720;font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap}
.cell span{font-size:10.5px;color:var(--mute);font-weight:600}
.dchart{margin-top:10px;height:52px;width:100%}
.clab{display:flex;justify-content:space-between;font-size:10.5px;color:var(--mute);margin-top:12px;font-weight:600}
.row{display:flex;justify-content:space-between;font-size:11.5px;padding:6px 0;border-top:1px solid rgba(255,255,255,.07)}
.row span{color:var(--mute)}
.row b{font-weight:650;font-variant-numeric:tabular-nums}
.empty h3{font-size:15px;font-weight:750;margin-top:2px}
.empty p{font-size:12px;color:var(--mute);margin-top:6px;line-height:1.45}
.ov{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.hint{display:flex;gap:10px;align-items:center;margin-top:14px;padding:10px 12px;border-radius:12px;background:rgba(255,61,127,.1);border:1px dashed rgba(255,61,127,.45);font-size:11.5px;color:#ffc4d7;line-height:1.4}
#table{padding:12px 12px 8px;display:flex;flex-direction:column;min-height:0;flex:1;overflow:hidden}
.tabs{display:flex;gap:4px;padding:3px;background:rgba(255,255,255,.06);border-radius:11px;flex:none}
.tabs button{all:unset;cursor:pointer;flex:1;text-align:center;font-size:12px;font-weight:650;padding:6px 0;border-radius:8px;color:var(--mute)}
.tabs button.on{background:rgba(255,255,255,.13);color:#fff}
.tabs button em{font-style:normal;font-size:10px;margin-left:5px;padding:1px 5px;border-radius:6px;background:rgba(255,61,127,.25);color:#ffc2d6}
#tbl{overflow:hidden;flex:1;margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:11.5px;font-variant-numeric:tabular-nums;table-layout:fixed}
th{font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);text-align:left;font-weight:700;padding:4px 4px 6px}
td{padding:6px 4px;border-top:1px solid rgba(255,255,255,.065);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
td.r,th.r{text-align:right}
td .mut{color:var(--mute)}
tr{cursor:pointer}
tr.sel td{background:rgba(255,61,127,.15)}
.qd{display:inline-flex;gap:2px;vertical-align:1px}
.qd i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.18)}
.qd i.f{background:var(--accent)}
.tag{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:6px;background:rgba(255,255,255,.09)}
.tag.p{background:rgba(255,61,127,.22);color:#ffc0d4}
.tag.g{background:rgba(91,227,176,.16);color:#8ff3cd}
.tag.y{background:rgba(255,193,90,.16);color:#ffd88e}
#label3d{position:fixed;left:0;top:0;pointer-events:none;padding:6px 11px 6px 9px;border-radius:12px;background:rgba(20,20,52,.74);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,61,127,.65);font-size:12px;font-weight:700;white-space:nowrap;display:none;box-shadow:0 6px 20px rgba(0,0,0,.35);z-index:3}
#label3d:after{content:'';position:absolute;left:50%;bottom:-9px;width:2px;height:9px;background:var(--accent);transform:translateX(-50%)}
#label3d i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:7px;box-shadow:0 0 8px var(--accent)}
#label3d small{color:var(--mute);font-weight:600;margin-left:6px}
.pop{position:fixed;left:0;top:0;font-size:11px;font-weight:800;color:#fff;padding:2px 6px;border-radius:7px;background:rgba(255,61,127,.88);pointer-events:none;white-space:nowrap;display:none;z-index:2;box-shadow:0 3px 10px rgba(255,61,127,.4)}
#cursor{position:fixed;left:0;top:0;width:28px;height:28px;pointer-events:none;z-index:50;display:none;transform-origin:3px 2px}
.rip{position:fixed;left:0;top:0;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:2.5px solid #fff;pointer-events:none;z-index:49;display:none;box-shadow:0 0 12px rgba(255,61,127,.8)}
#mobileBar{display:none}
body.capture *{transition:none!important;animation:none!important}
@media (max-width:480px){#clock{display:none}.logo b{font-size:16px}}
@media (max-height:930px){#detail{flex-basis:400px}.kpi{height:90px}}
@media (max-width:820px){
  #top{left:8px;right:8px;top:8px;height:52px;gap:7px;padding:0 8px}
  .search,#areas,#clock small,.pill .tmp,.logo span{display:none}
  #weatherName{max-width:88px;overflow:hidden;text-overflow:ellipsis}
  #left{left:8px;right:8px;top:68px;bottom:auto;width:auto;flex-direction:row;gap:6px}
  .kpi{flex:1;height:68px;padding:8px 9px;border-radius:14px}
  .kv{font-size:17px;margin-top:3px}.kv small{font-size:11px}
  .spark,.ks,.chip,.kbar,#tracker,.flex1{display:none}
  .kh{font-size:10px}
  #right{left:8px;right:8px;width:auto;top:auto;bottom:62px;max-height:46vh}
  #table{display:none}
  #detail{flex:0 1 auto;max-height:46vh;overflow:auto;display:none;padding:13px}
  body.hassel #detail{display:block}
  .av{display:none}
  #mobileBar{display:flex;position:fixed;left:8px;right:8px;bottom:8px;height:46px;gap:4px;padding:5px;overflow-x:auto;z-index:5;border-radius:14px}
  #mobileBar button{all:unset;cursor:pointer;flex:none;font-size:12px;font-weight:650;padding:0 12px;border-radius:10px;color:var(--mute);display:grid;place-items:center}
  #mobileBar button.on{background:rgba(255,61,127,.24);color:#fff}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>
<header id="top" class="glass">
  <div class="logo">
    <div class="mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10 12 4l9 6"/><path d="M5 10v9M19 10v9"/><path d="M3 10h18"/><path d="M5 14c2 1.5 4 1.5 7 0s5-1.5 7 0"/><circle cx="12" cy="17.5" r="1.6" fill="#fff" stroke="none"/></svg></div>
    <div><b>Talad</b><span>ตลาดนัด · Night Market Ops</span></div>
  </div>
  <label class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="search" placeholder="Search stalls, plates, boats" autocomplete="off"></label>
  <nav id="areas">
    <button data-area="food" class="on">Food Street</button><button data-area="fashion">Fashion Lane</button><button data-area="canal">Canal</button><button data-area="rank">Tuk-tuk Rank</button><button data-area="sky">Skytrain</button>
  </nav>
  <div class="spacer"></div>
  <div class="dd" id="weatherDD">
    <button class="pill" id="weatherBtn"><span id="weatherIcon"></span><span id="weatherName">Clear night</span><span class="tmp" id="weatherTemp">29°C</span><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg></button>
    <div class="menu glass" id="weatherMenu"></div>
  </div>
  <div id="clock">18:41:20<small>Wed 4 Nov</small></div>
  <div class="dd" id="alertDD">
    <button class="iconbtn" id="alertBtn"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg><span class="badge" id="alertBadge">3</span></button>
    <div class="menu glass" id="alertMenu" style="width:290px"></div>
  </div>
  <button class="toggle" id="dnToggle" title="Day / night"><svg class="ico" style="left:9px" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.4 1.4M17.6 17.6 19 19M5 19l1.4-1.4M17.6 6.4 19 5"/></svg><svg class="ico" style="right:9px" width="14" height="14" viewBox="0 0 24 24" fill="#fff"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><span class="knob"></span></button>
  <div class="av" title="Ploy S. · Night manager">PS</div>
</header>

<section id="left">
  <div class="glass kpi">
    <div class="kh"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FF3D7F" stroke-width="2.2" stroke-linecap="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17.5" cy="9" r="2.4"/><path d="M16 14.2c2.9.1 5 2.6 5 5.8"/></svg>Shoppers now<span class="chip" id="kShopChip">+4.2%</span></div>
    <div class="kv" id="kShop">2,418</div>
    <div class="ks" id="kShopSub">Peak forecast 3,050 at 20:30</div>
    <svg class="spark" id="sShop" viewBox="0 0 104 34" preserveAspectRatio="none"></svg>
  </div>
  <div class="glass kpi">
    <div class="kh"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FF3D7F" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg>Average queue time<span class="chip dn" id="kQueueChip">+0.4</span></div>
    <div class="kv" id="kQueue">6.4<small>min</small></div>
    <div class="ks" id="kQueueSub">Longest: A-04 Satay · 9 min</div>
    <svg class="spark" id="sQueue" viewBox="0 0 104 34" preserveAspectRatio="none"></svg>
  </div>
  <div class="glass kpi">
    <div class="kh"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FF3D7F" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M7 15h3"/></svg>Sales tonight<span class="chip" id="kSalesChip">+12%</span></div>
    <div class="kv" id="kSales">฿968,400</div>
    <div class="ks" id="kSalesSub">61% of ฿1.6M target</div>
    <div class="kbar" style="display:none"><i id="kSalesBar" style="width:61%"></i></div>
    <svg class="spark" id="sSales" viewBox="0 0 104 34" preserveAspectRatio="none"></svg>
  </div>

function chainOf(loc,lane){const bx=2+lane*0.32,gx=2+lane*0.55;
  switch(loc.k){
    case 'pt':return [[loc.x,loc.z],[loc.x,lane]];
    case 'stall':return [[loc.x,loc.z],[loc.x,lane]];

function route(from,to,lane){return chainOf(from,lane).concat(chainOf(to,lane).reverse());}

function newAgent(a){a.lane=(SR()*2-1)*1.7;a.spd=1.15+SR()*0.45;a.visits=0;a.maxVisits=2+Math.floor(SR()*3);a.item=0;a.itemT=0;a.spent=0;a.items=0;a.steps=0;a.party=1+Math.floor(SR()*3);}

function pickStall(a,exclude){let best=null,bs=-1;for(let k=0;k<5;k++){const s=stalls[Math.floor(SR()*stalls.length)];if(s===exclude)continue;const sc=3-s.queue.length-s.incoming*0.5+SR();if(sc>bs){bs=sc;best=s;}}return best||stalls[0];}
function decide(a){a.visits++;const r=SR();
  if(a.visits>a.maxVisits){setPath(a,exitLoc(),'exit');return;}

  else lab.style.display='none';
  // money pops for recent payments
  let pi=0;for(let j=lastPayments.length-1;j>=0&&pi<pops.length;j--){const pay=lastPayments[j];const age=t-pay.t;if(age>1.6)break;if(age<0)continue;const s=stalls[pay.s];const p=new THREE.Vector3(s.x,4.6+age*0.9,-s.dir*4.6);const sp=project(p);const el=pops[pi++];el.style.display=sp[2]<1?'block':'none';el.textContent='+฿'+pay.price;el.style.transform=`translate(${sp[0].toFixed(1)}px,${sp[1].toFixed(1)}px) translate(-50%,-50%) scale(${(0.8+0.25*easeOut(age/0.3)).toFixed(3)})`;el.style.opacity=(sstep(0,0.15,age)*sstep(1.6,1.1,age)).toFixed(3);}
  for(;pi<pops.length;pi++)pops[pi].style.display='none';
}

// ---------------------------------------------------------------- selection ring update
function updateSelection(t){const sel=STATE.sel;if(!sel){selRing.visible=selPulse.visible=selDisc.visible=false;return;}const p=selPos(sel,t);const inf=selInfo(sel);const a=CAPTURE?easeOut((t-STATE.selT0)/0.35):1;
  const y=(sel.type==='boat'||sel.type==='paddle')?WATER_Y+0.06:p.y+0.08;const hd=selHeading(sel,t);
  const pulse=1+0.05*Math.sin(t*6);selRing.visible=selPulse.visible=selDisc.visible=true;
  selRing.position.set(p.x,y,p.z);selRing.rotation.y=hd;selRing.scale.set(inf.ring[0]*pulse*(0.6+0.4*a),1,inf.ring[1]*pulse*(0.6+0.4*a));selRing.material.opacity=0.95*a;
  const pk=wrap(t*0.9,0,1);selPulse.position.copy(selRing.position);selPulse.rotation.y=hd;selPulse.scale.set(inf.ring[0]*(1+pk*0.7),1,inf.ring[1]*(1+pk*0.7));selPulse.material.opacity=0.7*(1-pk)*a;
  selDisc.position.set(p.x,y-0.01,p.z);selDisc.rotation.y=hd;selDisc.scale.set(inf.ring[0]*1.05,1,inf.ring[1]*1.05);selDisc.material.opacity=0.4*a;}

// ---------------------------------------------------------------- frame
function updateScaleUniforms(){const h=renderer.domElement.height;const s=h/(2*Math.tan(THREE.MathUtils.degToRad(camera.fov)/2));for(const c of [smokeC,glowStatic,glowDyn,sparkC,waterC])c.mat.uniforms.uScale.value=s;}
updateScaleUniforms();
function frame(t,cap){
  applyEnv(t);
  applyCam(camera,CAM);
  // shadow camera follows the view
  const half=clamp(CAM.d*0.62,26,78);const sc=sun.shadow.camera;if(sc.right!==half){sc.left=-half;sc.right=half;sc.top=half;sc.bottom=-half;sc.updateProjectionMatrix();}
  sun.target.position.set(CAM.tx,0,CAM.tz);sun.position.copy(sun.target.position).addScaledVector(ENV.sunDir,140);
  updateVehicles(t);updatePeople(t);updateFlames(t);updateParticles(t,camera);updateSelection(t);
  rip.material.map.offset.x=t*0.012;
  renderer.render(scene,camera);
  updateUI(t,cap);
}

// ---------------------------------------------------------------- capture tour
const TOUR={click:4.8,wOpen:9.25,wPick:10.0,night:11.5,end:14};
function boatSel(){return {type:'boat',ref:boat};}
function followPose(t){const b=boatState(PREWARM+t);return {tx:b.x+0.8,ty:0,tz:b.z+2.2,d:40,az:0.26,el:0.78};}
function heroAt(t){return Object.assign({},HERO,{az:HERO.az+0.012*t,d:HERO.d-0.4*t});}
function camAt(t){if(t<TOUR.click)return heroAt(t);
  if(t<TOUR.click+1.7){return lerpPose(heroAt(TOUR.click),followPose(t),ease((t-TOUR.click)/1.7));}
  if(t<TOUR.night)return followPose(t);
  const f=ease((t-TOUR.night)/2.5);const fp=followPose(t);return lerpPose(fp,{tx:lerp(fp.tx,4,0.55),ty:0,tz:lerp(fp.tz,-8,0.6),d:66,az:0.44,el:0.66},f);}
let UIR=null;
function measureUI(){const r=e=>{const b=e.getBoundingClientRect();return [b.left+b.width/2,b.top+b.height/2];};const m=$('weatherMenu');m.classList.add('open');const items={};m.querySelectorAll('.mi').forEach(b=>items[b.dataset.w]=r(b));m.classList.remove('open');UIR={weather:r($('weatherBtn')),items,toggle:r($('dnToggle'))};}
function cursorAt(t){const P0=[930,880];const clickPos=(()=>{const P=heroAt(TOUR.click);applyCam(camTmp,P);const b=boatState(PREWARM+TOUR.click);const s=project(new THREE.Vector3(b.x,WATER_Y+0.8,b.z),camTmp);return [s[0],s[1]];})();
  const R1=[clickPos[0]+60,clickPos[1]+120];const W=[UIR.weather[0]-8,UIR.weather[1]+4];const K=[UIR.items.krathong[0]-40,UIR.items.krathong[1]+2];const TG=[UIR.toggle[0]+12,UIR.toggle[1]+3];const R2=[TG[0]-120,TG[1]+260];
  const seg=(a,b,t0,t1,arc)=>{const f=ease((t-t0)/(t1-t0));const x=lerp(a[0],b[0],f),y=lerp(a[1],b[1],f);const dx=b[0]-a[0],dy=b[1]-a[1];const L=Math.hypot(dx,dy)||1;const o=Math.sin(Math.PI*f)*(arc||0.12)*L;return [x-dy/L*o,y+dx/L*o];};
  let p;
  if(t<4.0)p=P0;
  else if(t<TOUR.click){const b=boatState(PREWARM+t);applyCam(camTmp,camAt(t));const s=project(new THREE.Vector3(b.x,WATER_Y+0.8,b.z),camTmp);const f=ease((t-4.0)/(TOUR.click-4.0));const o=Math.sin(Math.PI*f)*60;p=[lerp(P0[0],s[0],f)+o,lerp(P0[1],s[1],f)-o*0.3];}
  else if(t<5.6)p=clickPos;
  else if(t<6.5)p=seg(clickPos,R1,5.6,6.5,0.1);
  else if(t<8.5)p=R1;
  else if(t<9.2)p=seg(R1,W,8.5,9.2,0.15);
  else if(t<9.35)p=W;
  else if(t<9.9)p=seg(W,K,9.35,9.9,-0.12);
  else if(t<10.6)p=K;
  else if(t<11.4)p=seg(K,TG,10.6,11.4,0.2);
  else if(t<12.0)p=TG;
  else if(t<13.0)p=seg(TG,R2,12.0,13.0,0.12);
  else p=R2;
  const clicks=[TOUR.click,TOUR.wOpen,TOUR.wPick,TOUR.night];let press=0,rip=null;for(const c of clicks){const d=t-c;if(d>-0.08&&d<0.1)press=1-Math.abs(d)/0.1;if(d>=0&&d<0.55)rip={age:d,at:c};}
  const vis=sstep(3.3,3.8,t);return {x:p[0],y:p[1],press,rip,vis,clickPos};}
function tourState(t){const T0=PREWARM;
  STATE.sel=t>=TOUR.click?boatSel():null;STATE.selT0=T0+TOUR.click;
  STATE.menu=t>=TOUR.wOpen&&t<TOUR.wPick+0.12;STATE.menuHover=(t>=9.75&&t<TOUR.wPick+0.12)?'krathong':null;
  if(t>=TOUR.wPick){STATE.wFrom='clear';STATE.wTo='krathong';STATE.wT0=T0+TOUR.wPick;}else{STATE.wFrom='clear';STATE.wTo='clear';STATE.wT0=-1e9;}
  if(t>=TOUR.night){STATE.nFrom=0.5;STATE.nTo=1;STATE.nT0=T0+TOUR.night;}else{STATE.nFrom=0.5;STATE.nTo=0.5;STATE.nT0=-1e9;}
  Object.assign(CAM,camAt(t));}
function drawCursor(t){const c=cursorAt(t);const el=$('cursor');el.style.display=c.vis>0.01?'block':'none';el.style.opacity=c.vis.toFixed(3);el.style.transform=`translate(${(c.x-3).toFixed(1)}px,${(c.y-2).toFixed(1)}px) scale(${(1-0.18*c.press).toFixed(3)})`;
  const r=$('rip');if(c.rip){const f=c.rip.age/0.55;r.style.display='block';r.style.transform=`translate(${c.x.toFixed(1)}px,${c.y.toFixed(1)}px) scale(${(0.3+1.2*easeOut(f)).toFixed(3)})`;r.style.opacity=(1-f).toFixed(3);}else r.style.display='none';}

// ---------------------------------------------------------------- boot
function setBoatPhase(){BOAT_OFF=PREWARM+TOUR.click-((-4.6-BX0)/BOAT_V);}
setBoatPhase();
function runTo(simT){const target=Math.round(simT/STEP);if(target<simSteps){initSim();}while(simSteps<target)simStep();}
initSim();runTo(PREWARM);
if(CAPTURE){
  document.fonts&&document.fonts.ready;measureUI();
  window.__render=function(t){runTo(PREWARM+t);tourState(t);frame(simTime,t);drawCursor(t);return true;};
  window.__render(0);
  window.__clickInfo=(()=>{const c=cursorAt(TOUR.click);return {t:TOUR.click,x:c.x,y:c.y,xPct:c.x/innerWidth*100,yPct:c.y/innerHeight*100};})();
  window.__ready=true;
}else{
  // ----------------------------------------------------------- real-time mode
  Object.assign(camGoal,HERO);Object.assign(camNow,HERO);Object.assign(CAM,HERO);
  let acc=0,last=performance.now();const ray=new THREE.Raycaster();const ndc=new THREE.Vector2();
  let follow=false;
  function select(sel){STATE.sel=sel;STATE.selT0=simTime;document.body.classList.toggle('hassel',!!sel);if(sel){const inf=selInfo(sel);follow=true;camGoal.d=Math.min(camGoal.d,inf.dist);if(sel.type==='stall'){const p=selPos(sel,simTime);camGoal.tx=p.x;camGoal.tz=p.z+(sel.ref.dir>0?3:-3);camGoal.d=inf.dist;follow=false;}}else follow=false;}
  function setWeather(k){if(k===STATE.wTo)return;STATE.wFrom=STATE.wTo;STATE.wTo=k;STATE.wT0=simTime;}
  function toggleNight(){const N=nightAt(simTime);STATE.nFrom=N;STATE.nTo=N>0.75?0.45:1;STATE.nT0=simTime;STATE.clockShift+=STATE.nTo>0.75?3960:-3960;}
  function pick(cx,cy){ndc.set(cx/innerWidth*2-1,-(cy/innerHeight)*2+1);ray.setFromCamera(ndc,camera);const hits=ray.intersectObjects(PICK.concat([I.body]),false);for(const h of hits){if(h.object===I.body){const p=persons[h.instanceId];if(p&&p.kind==='shopper'&&p.vis)return {type:'shopper',ref:p};if(p&&p.kind==='vendor')return {type:'stall',ref:VENDORS[p.idx].stall};continue;}if(h.object.userData.sel&&h.object.parent.visible!==false)return h.object.userData.sel;}return null;}
  // pointer controls
  const ptrs=new Map();let mode=null,downAt=null,moved=0,pinch0=null;
  canvas.addEventListener('contextmenu',e=>e.preventDefault());
  canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;downAt={x:e.clientX,y:e.clientY};mode=(e.button===2||e.shiftKey)?'rot':'pan';canvas.classList.add('drag');if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch0={d:Math.hypot(a.x-b.x,a.y-b.y),ang:Math.atan2(b.y-a.y,b.x-a.x),cd:camGoal.d,caz:camGoal.az,mx:(a.x+b.x)/2,my:(a.y+b.y)/2};}closeMenus();});
  canvas.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;const pr=ptrs.get(e.pointerId);const dx=e.clientX-pr.x,dy=e.clientY-pr.y;pr.x=e.clientX;pr.y=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);
    if(ptrs.size===2&&pinch0){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);camGoal.d=clamp(pinch0.cd*pinch0.d/Math.max(20,d),12,220);camGoal.az=pinch0.caz-(Math.atan2(b.y-a.y,b.x-a.x)-pinch0.ang);const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;panBy((mx-pinch0.mx)*0.5,(my-pinch0.my)*0.5);pinch0.mx=mx;pinch0.my=my;return;}
    if(moved<4)return;
    if(mode==='rot'){camGoal.az-=dx*0.006;camGoal.el=clamp(camGoal.el+dy*0.004,0.25,1.35);}else{panBy(dx,dy);}});
  function panBy(dx,dy){follow=false;const k=camGoal.d*0.0018*(900/innerHeight);const ca=Math.cos(camGoal.az),sa=Math.sin(camGoal.az);camGoal.tx-=(dx*ca+dy*sa/Math.sin(camGoal.el)*0.0+dy*sa)*k;camGoal.tz-=(-dx*sa+dy*ca)*k;camGoal.tx=clamp(camGoal.tx,-90,90);camGoal.tz=clamp(camGoal.tz,-70,50);}
  canvas.addEventListener('pointerup',e=>{ptrs.delete(e.pointerId);canvas.classList.remove('drag');if(ptrs.size<2)pinch0=null;if(moved<6&&downAt&&e.button!==2){const s=pick(e.clientX,e.clientY);select(s);}downAt=null;});
  canvas.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);pinch0=null;});
  canvas.addEventListener('wheel',e=>{e.preventDefault();camGoal.d=clamp(camGoal.d*Math.exp(e.deltaY*0.0012),12,220);},{passive:false});
  // UI wiring
  function closeMenus(){STATE.menu=false;STATE.alertOpen=false;$('alertMenu').classList.remove('open');}
  $('weatherBtn').addEventListener('click',e=>{e.stopPropagation();STATE.menu=!STATE.menu;STATE.alertOpen=false;$('alertMenu').classList.remove('open');});
  $('weatherMenu').addEventListener('click',e=>{const b=e.target.closest('.mi');if(!b)return;setWeather(b.dataset.w);STATE.menu=false;e.stopPropagation();});
  $('alertBtn').addEventListener('click',e=>{e.stopPropagation();STATE.alertOpen=!STATE.alertOpen;STATE.menu=false;$('alertMenu').innerHTML=alertsHTML(simTime);$('alertMenu').classList.toggle('open',STATE.alertOpen);});
  $('alertMenu').addEventListener('click',e=>{const b=e.target.closest('.ai');if(!b)return;const [k,v]=b.dataset.alert.split(':');if(k==='stall')select({type:'stall',ref:stalls[+v]});else if(k==='train'){const tr=trains.slice().sort((a,b)=>wrap(11-trainState(a,simTime).u,0,TR_P)-wrap(11-trainState(b,simTime).u,0,TR_P))[0];select({type:'train',ref:tr});}else select({type:'tuk',ref:tuks[+v]});closeMenus();});
  document.addEventListener('click',e=>{if(!e.target.closest('.dd'))closeMenus();});
  $('dnToggle').addEventListener('click',toggleNight);
  document.querySelectorAll('[data-area]').forEach(b=>b.addEventListener('click',()=>{const A=AREAS[b.dataset.area];follow=false;Object.assign(camGoal,A);}));
  $('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;STATE.tab=b.dataset.tab;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));$('tbl').innerHTML=tableHTML(simTime);});
  $('tbl').addEventListener('click',e=>{const tr=e.target.closest('tr');if(!tr)return;if(tr.dataset.stall)select({type:'stall',ref:stalls[+tr.dataset.stall]});if(tr.dataset.tuk)select({type:'tuk',ref:tuks[+tr.dataset.tuk]});});
  $('detail').addEventListener('click',e=>{if(e.target.closest('#dx'))select(null);});
  $('search').addEventListener('keydown',e=>{if(e.key!=='Enter')return;const q=e.target.value.trim().toLowerCase();if(!q)return;let s=stalls.find(s=>s.id.toLowerCase()===q||s.en.toLowerCase().includes(q)||s.th.includes(q));if(s){select({type:'stall',ref:s});return;}const tk=tuks.find(k=>k.def.plate.replace(/\s/g,'').includes(q.replace(/\s/g,''))||k.def.driver.toLowerCase().includes(q));if(tk){select({type:'tuk',ref:tk});return;}if(/boat|long|canal|เรือ/.test(q)){select({type:'boat',ref:boat});return;}if(/fruit|paddle/.test(q)){select({type:'paddle',ref:paddle});return;}if(/train|sky|bts/.test(q)){select({type:'train',ref:trains[0]});return;}});
  addEventListener('keydown',e=>{if(e.key==='Escape'){select(null);closeMenus();}});
  addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();updateScaleUniforms();});
  if(innerWidth<820){Object.assign(camGoal,{d:80});}
  function loop(now){const dt=Math.min(0.1,(now-last)/1000);last=now;acc+=dt;let n=0;while(acc>=STEP&&n<12){simStep();acc-=STEP;n++;}if(n>=12)acc=0;
    const t=simTime;
    if(follow&&STATE.sel){const p=selPos(STATE.sel,t);camGoal.tx=p.x+(STATE.sel.type==='boat'?1:0);camGoal.tz=p.z+(STATE.sel.type==='train'?6:2.5);camGoal.ty=STATE.sel.type==='train'?4:0;if(STATE.sel.type==='shopper'&&!STATE.sel.ref.vis)select(null);}
    else camGoal.ty=lerp(camGoal.ty||0,0,0.05);
    const k=1-Math.exp(-dt*4);const P=lerpPose(camNow,camGoal,k);Object.assign(camNow,P);Object.assign(CAM,P);
    frame(t);requestAnimationFrame(loop);}
  requestAnimationFrame(loop);
  window.__talad={STATE,select,setWeather,toggleNight};
}
})();
</script>
